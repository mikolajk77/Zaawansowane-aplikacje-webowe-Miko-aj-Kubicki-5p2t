<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wizytowka- Mikolaj Kubicki</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="naglowek">
<img class="avatar" src="avatar.svg" alt="Avatar : inicjaly JK na fioletowym tle">
<div class="naglowek_tekst">
<h1>Mikolaj Kubicki</h1>
<p class="podtytul">Technik programista . klasa 5</p>
    </div></header>
    <main>
<section id="o-mnie">
<h2>O mnie</h2>
<p>Ucze sie programowania alplikacji webowych . Najbardzije interesuje mnie front-end, ale chce rozumiec tez to , co sie dzije po stronie serwera </p>

</section>
<section id="umiejetnosci">
<h2>Uimiejetnosci</h2>
<ul class="lista-umiejetnosci">

    <li>HTML</li>
     <li>CSS</li>
      <li>Vue</li>
       <li>TailWind</li>
     <li>React</li>
</ul>

</section>
<section id="kontakt"><h2>Kontakt</h2>



  <form id="formularz" novalidate>

        <div class="pole">
          <label for="imie">Imie i nazwisko</label>
          <input type="text" id="imie" name="imie">
          <p class="blad" id="blad-imie"></p>
        </div>

        <div class="pole">
          <label for="email">Adres e-mail</label>
          <input type="email" id="email" name="email">
          <p class="blad" id="blad-email"></p>
        </div>

        <div class="pole">
          <label for="temat">Temat</label>
          <select id="temat" name="temat">
            <option value="">— wybierz temat —</option>
            <option value="wspolpraca">Propozycja wspolpracy</option>
            <option value="pytanie">Pytanie o projekt</option>
            <option value="inne">Inne</option>
          </select>
          <p class="blad" id="blad-temat"></p>
        </div>

        <div class="pole">
          <label for="wiadomosc">Wiadomosc</label>
          <textarea id="wiadomosc" name="wiadomosc" rows="5"></textarea>
          <p class="blad" id="blad-wiadomosc"></p>
        </div>

        <button type="submit" class="przycisk">Wyslij wiadomosc</button>
      </form></section>


    </main>
    <footer class="stopka"></footer>
<script src="main.js"></script>
</body>

</html>
